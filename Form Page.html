<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>表单</title>
    <style>


        form {
            /* 居中表单 */
            margin: 0 auto;
            width: 800px;
            /* 显示表单的轮廓 */
            padding: 1em;
            border: 3px solid #ccc;
            border-radius: 3em;

        }

        input {
            margin: 0.7rem;
        }

        button {
            position: relative;
            background-color:dodgerblue;
            border:2px solid #008cba;
            border-radius:8px;
            font-size: 18px;
            color:beige;
            padding: 10px 20px;
            margin: 4px 2px;
            text-align: center;
            -webkit-transition-duration: 0.4s;
            transition-duration: 0.4s;
            text-decoration: none;
            overflow: hidden;
            cursor: pointer;
        }



    </style>


</head>

<body>
<form action="" method="post">

    <label for="myDateTime">Select a date and time:</label>
    <input type="datetime-local" id="myDateTime" name="myDateTime">
    <br>

<span>Photo/Video Upload</span>
<br>
<input type="image">

    <h2>battery design</h2>


<ul>

    <li>1.1
        <br>
    <label>1.1.1</label>
   <input type="text" placeholder="explanation" style="width: 300px; height: 20px;">

        <br>
    <label>1.1.2</label>
    <input type="text" placeholder="explanation" style="width: 300px; height: 20px;">

        <br>
    <label>1.1.3</label>
    <input type="text" placeholder="explanation" style="width: 300px; height: 20px;">
    </li>

    <br>

    <li>1.2
<br>

        <label>1.2.1</label>
        <input type="text" style="width: 400px; height: 20px;" placeholder="explanation">

        <br>

        <label>1.2.2</label>
        <input type="text" style="width: 300px; height: 20px;" placeholder="explanation">
        <br>
        <i>
            <font size="2" style = "color:#ff0000;">* explanation
        </font>
        </i>
<br>


        <label>1.2.3</label>
        <input type="text" style="width: 300px; height: 20px;" placeholder="explanation">

        <br>
        <i>
            <font size="2" style = "color:#ff0000;">* explanation
            </font>
        </i>
<br>


        <label>1.2.4</label>

        <input type="radio" id="优秀" name="drone" value="优秀" checked>
        <label for="优秀">perfect</label>
        <input type="radio" id="良好" name="drone" value="良好">
        <label for="良好">good</label>
        <input type="radio" id="中等" name="drone" value="中等">
        <label for="中等">medium</label>
        <input type="radio" id="及格" name="drone" value="及格">
        <label for="及格">pass</label>

    </li>

    <li>1.3</li>
    <input type="radio" id="是" name="drone1" value="是" checked>
    <label for="是">yes</label>

    <input type="radio" id="否" name="drone1" value="否">
    <label for="否">no</label>


    <li>1.4</li>
    <input type="radio" id="是1" name="label" value="是" checked>
    <label for="是1">yes</label>

    <input type="radio" id="否1" name="label" value="否">
    <label for="否1">no</label>


</ul>


    <h2>battery lifecycle</h2>
    <!--
    1、SOC（State of charge）为电池荷电状态，常用来表示电池剩余电量。
    2、SOH（State of health）为电池健康状态，常用来表示电池的剩余电量。
    3、SOP（State of power）是电池功率状态，通常用短时最高功率值来表示。
    -->

        <span style="color:red;margin-right:4px">*</span>
        <span>2.1</span>
        <span><input type="text" style="width: 300px; height: 20px;" placeholder="explanation" required="required"> </span>
    <br>

    <span style="color:red;margin-right:4px">*</span>
        <span>2.2</span>
        <span><input type="text" style="width: 300px; height: 20px;" placeholder="explanation"></span>
    <br>

    <span style="color:red;margin-right:4px">*</span>
        <span>2.3</span>
        <span><input type="text" style="width: 300px; height: 20px;" placeholder="explanation"> </span>
    <br>

    <!-- 锂离子电池的磷酸锂材料主要有钴酸锂、锰酸锂、镍酸锂、三元材料、磷酸铁锂等 -->
<br>
    <fieldset>
        <legend style="font-size: 22px;">Choose your battery material:</legend>

        <div>
            <input type="checkbox" id="scales" name="scales" checked />
            <label for="scales">3.1</label>
        </div>

        <div>
            <input type="checkbox" id="horns" name="horns" />
            <label for="horns">3.2</label>
        </div>

        <div>
            <input type="checkbox" id="horns2" name="horns" />
            <label for="horns">3.3</label>
        </div>

        <div>
            <input type="checkbox" id="horns3" name="horns" />
            <label for="horns">3.4</label>
        </div>

        <div>
            <input type="checkbox" id="horns4" name="horns" />
            <label for="horns">3.5</label>
        </div>



    </fieldset>

    <button type="submit">Send your message</button>
<button type="reset">Reset</button>
</form>

</body>
</html>
